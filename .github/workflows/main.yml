name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Check Java version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Setup network
        run: |
          docker network create se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo
          sleep 10

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: View logs
        run: docker logs devopscontainer

      - name: Check MongoDB
        run: |
            docker ps
            docker inspect mongo-dbserver
            docker network inspect se-methods